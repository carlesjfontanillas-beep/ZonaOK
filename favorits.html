    .zok-favorites-app .zok-foldable > .zok-favorite-list{max-height:none;overflow:visible}
    .zok-favorites-app .zok-foldable > h2 > .zok-fold-toggle{
      appearance:none;-webkit-appearance:none;display:flex;align-items:center;gap:12px;width:100%;

    }

  <script id="zok-favorites-accordion-init">
    document.addEventListener('DOMContentLoaded',function initFavoriteAccordion(){
  const root=document.getElementById('favorites-groups');
  if(!root)return;
  const open=new Set(['Clubs']);
  const positions=new Map();
  function enhance(){
    for(const section of root.children){
      if(!section.classList.contains('zok-favorite-group')||section.classList.contains('zok-foldable'))continue;
      const heading=section.querySelector(':scope > h2');
      if(!heading)continue;
      const count=heading.querySelector('small');
      const key=Array.from(heading.childNodes).filter(n=>n.nodeType===3).map(n=>n.textContent).join('').trim();
      if(!key)continue;
      const button=document.createElement('button');
      button.type='button';button.className='zok-fold-toggle';
      const title=document.createElement('span');
      title.className='zok-fold-title';title.textContent=key;
      const arrow=document.createElement('span');
      arrow.className='zok-fold-arrow';arrow.setAttribute('aria-hidden','true');
      button.append(title);if(count)button.append(count);button.append(arrow);
      heading.replaceChildren(button);
      function apply(){
        const expanded=open.has(key);
        section.classList.toggle('zok-folded',!expanded);
        button.setAttribute('aria-expanded',String(expanded));
      }
      section.classList.add('zok-foldable');apply();
      if(open.has(key))section.scrollTop=positions.get(key)||0;
      section.addEventListener('scroll',()=>{if(open.has(key))positions.set(key,section.scrollTop)},{passive:true});
      button.addEventListener('click',()=>{
        if(open.has(key)){open.delete(key);positions.delete(key);section.scrollTop=0;}
        else{open.add(key);}
        apply();
        if(open.has(key))section.scrollIntoView({block:'start',behavior:'auto'});
      });
    }
  }
  new MutationObserver(enhance).observe(root,{childList:true});
  enhance();
},{once:true});
  </script>

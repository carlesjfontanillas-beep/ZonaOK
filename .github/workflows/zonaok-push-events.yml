name: ZonaOK - avisos FECAPA
run-name: ${{ github.event_name == 'schedule' && 'ZonaOK Push scheduled' || format('ZonaOK Push {0} {1} {2} {3}', inputs.test_scenario, inputs.event_source, inputs.before_sha, inputs.after_sha) }}

on:
  workflow_dispatch:
    inputs:
      test_scenario:
        description: "Flux d’avisos"
        required: true
        type: choice
        options:
          - empty
          - barca_nc
          - production
          - scheduled_now
          - semireal_barca_voltrega
        default: empty
      before_sha:
        type: string
        required: false
      after_sha:
        type: string
        required: false
      event_source:
        type: choice
        options: [directe, agenda]
        default: directe
  schedule:
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'

permissions:
  contents: read
  id-token: write

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar detector i parser d’incidències
        run: python -m unittest discover -s tests -p 'test_push_*.py' -v
      - name: Preparar catàlegs i acta ficticis Barça NC M
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scenario == 'barca_nc' }}
        run: >-
          python scripts/zonaok_push_test_batch.py --run-id "$GITHUB_RUN_ID"
          --before push-test-before.json --live push-test-live.json
          --final push-test-final.json --acta push-test-acta.json
      - name: Detectar inici i canvi d’horari amb el detector habitual
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scenario == 'barca_nc' }}
        shell: bash
        run: |
          set -euo pipefail
          since_before="$(python -c 'import json; print(json.load(open("push-test-before.json"))["matches"][0]["lastDirecteAt"])')"
          since_live="$(python -c 'import json; print(json.load(open("push-test-live.json"))["matches"][0]["lastDirecteAt"])')"
          python scripts/zonaok_push_events.py --before push-test-before.json --after push-test-live.json --since "$since_before" > push-test-start.json
          python scripts/zonaok_push_events.py --before push-test-live.json --after push-test-final.json --since "$since_live" > push-test-finish.json
          python - <<'PY'
          import json
          first=json.load(open('push-test-start.json', encoding='utf-8'))['events']
          second=json.load(open('push-test-finish.json', encoding='utf-8'))['events']
          events=first+second
          assert {item['event'] for item in events} == {'start','finish','scheduleChange'}, events
          for item in events: item['test']=True
          json.dump({'dryRun':True,'events':events}, open('push-detection.json','w',encoding='utf-8'), ensure_ascii=False)
          json.dump({'schema':'zonaok-push-event-batch-v1','season':'2026/2027','events':events}, open('push-batch.json','w',encoding='utf-8'), ensure_ascii=False)
          print('Detector produït: inici, final i canvi d’horari ficticis; tots marcats PROVA.')
          PY
      - name: Preparar lot buit sense enviar avisos
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scenario == 'empty' }}
        run: printf '%s\n' '{"schema":"zonaok-push-event-batch-v1","season":"2026/2027","events":[]}' > push-batch.json
      - name: Detectar canvis de la captura exacta o inicis d'Agenda
        if: ${{ github.event_name == 'schedule' || inputs.test_scenario == 'production' || inputs.test_scenario == 'scheduled_now' }}
        env:
          BEFORE_SHA: ${{ inputs.before_sha }}
          AFTER_SHA: ${{ inputs.after_sha }}
          EVENT_SOURCE: ${{ inputs.event_source }}
          REQUEST_SCENARIO: ${{ inputs.test_scenario }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$REQUEST_SCENARIO" = scheduled_now ]; then
            git fetch origin main
            git show origin/main:zonaok-tots-partits.json > push-after.json
            python scripts/zonaok_push_events.py --after push-after.json --scheduled --plan imports/push-plan.json > push-detection.json
          else
            [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$AFTER_SHA" =~ ^[0-9a-f]{40}$ ]]
            git fetch origin main
            git merge-base --is-ancestor "$AFTER_SHA" origin/main
            [ "$(git rev-parse "$AFTER_SHA^")" = "$BEFORE_SHA" ]
            git show "$BEFORE_SHA:zonaok-tots-partits.json" > push-before.json
            git show "$AFTER_SHA:zonaok-tots-partits.json" > push-after.json
            PUSH_SINCE="$(python -c 'import json,sys; print(json.load(open("push-before.json")).get("sources",{}).get(sys.argv[1],{}).get("capturedAt") or "2026-07-01T00:00:00Z")' "$EVENT_SOURCE")"
            python scripts/zonaok_push_events.py --before push-before.json --after push-after.json --since "$PUSH_SINCE" --source "$EVENT_SOURCE" --include-scheduled --plan imports/push-plan.json > push-detection.json
          fi
          python - <<'PY'
          import json
          events=json.load(open('push-detection.json'))['events']
          assert all(e.get('source')=='FECAPA' and e.get('event') in ('start','finish','scheduleChange') for e in events)
          json.dump({'schema':'zonaok-push-event-batch-v1','season':'2026/2027','events':events},open('push-batch.json','w'),ensure_ascii=False)
          print('Avisos:',len(events))
          PY
      - name: Enviar esdeveniments detectats pel canal habitual
        if: ${{ github.event_name == 'schedule' || inputs.test_scenario == 'production' || inputs.test_scenario == 'barca_nc' || inputs.test_scenario == 'scheduled_now' }}
        shell: bash
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zonaok-push"
          token="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$request_url" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          # Pass credentials via environment, never persist or print them.
          ZONAOK_PUSH_TOKEN="$token" python scripts/zonaok_push_transport.py push-batch.json
      - name: Preparar incidències semi reals Barça–Voltregà
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scenario == 'semireal_barca_voltrega' }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, unicodedata
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/Madrid'))
          fixture = {
              'internalId': 'fecapa:2026-11-27:barcelona-voltrega-masies',
              'iso': now.date().isoformat(),
              'time': (now - timedelta(minutes=45)).strftime('%H:%M'),
              'competition': 'NACIONAL CATALANA MASCULINA',
              'home': 'FC BARCELONA',
              'away': 'CLUB PATÍ VOLTREGÀ - MASIES',
              'leagueId': '', 'matchId': ''
          }
          events = [
              ('goal','P1','04:00','FC BARCELONA','1-0'),
              ('goal','P1','12:00','CLUB PATÍ VOLTREGÀ - MASIES','1-1'),
              ('card','P1','16:00','CLUB PATÍ VOLTREGÀ - MASIES',''),
              ('goal','P2','08:00','FC BARCELONA','2-1'),
              ('directFoul','P2','13:00','FC BARCELONA',''),
              ('goal','P2','17:00','FC BARCELONA','3-1'),
              ('goal','P2','20:00','FC BARCELONA','4-1'),
          ]
          observed = datetime.now().astimezone().isoformat()
          def norm(value):
              raw = ''.join(c for c in unicodedata.normalize('NFD', str(value or '')) if unicodedata.category(c) != 'Mn')
              return ' '.join(raw.upper().split())
          incidents = []
          for e,p,t,team,score in events:
              item = {'event':e,'period':p,'matchClock':t,'team':team,'player':'','score':score,'ordinal':1,'observedAt':observed}
              material = '|'.join(norm(value).replace('|','/') for value in ('2026/2027',fixture['internalId'],e,p,t,team,'',score,'1'))
              item['eventId'] = hashlib.sha256(material.encode()).hexdigest()
              incidents.append(item)
          payload = {'schema':'zonaok-push-live-incidents-v1','season':'2026/2027','matches':[{'fixture':fixture,'observedAt':observed,'startedNow':False,'incidents':incidents}]}
          with open('push-live-incidents.json','w',encoding='utf-8') as f: json.dump(payload,f,ensure_ascii=False)
          print('Incidències preparades:',len(incidents))
          PY
      - name: Seleccionar partits amb preferències d’incidències actives
        if: ${{ inputs.test_scenario == 'barca_nc' || (inputs.test_scenario == 'production' && inputs.event_source == 'directe') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f push-test-live.json ]; then catalog=push-test-live.json; else catalog=push-after.json; fi
          python scripts/zonaok_push_live_incidents.py candidates --input "$catalog" --output push-live-candidates.json
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zonaok-push"
          token="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$request_url" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST 'https://zonaok-push.carles-j-fontanillas.workers.dev/sports-candidates' \
            -H 'Content-Type: application/json' -H "Authorization: Bearer ${token}" \
            --data-binary @push-live-candidates.json > push-live-selection.json
          python - <<'PY'
          import json
          result=json.load(open('push-live-selection.json', encoding='utf-8'))
          assert result.get('schema') == 'zonaok-push-live-selection-v1'
          assert all(x.get('fixture',{}).get('competition') in ('NACIONAL CATALANA MASCULINA','NACIONAL CATALANA FEMENINA') for x in result.get('matches',[]))
          print('Partits seleccionats per preferències:', len(result.get('matches',[])))
          PY
      - name: Parsejar incidències fictícies amb el parser habitual
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scenario == 'barca_nc' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from zonaok_push_live_incidents import parse_incidents
          selection=json.load(open('push-live-selection.json', encoding='utf-8'))
          acta=json.load(open('push-test-acta.json', encoding='utf-8'))
          fixture=acta['fixture']
          key=f"{fixture['leagueId']}|{fixture['matchId']}"
          starts={str(e.get('fixture',{}).get('leagueId'))+'|'+str(e.get('fixture',{}).get('matchId')) for e in json.load(open('push-detection.json', encoding='utf-8'))['events'] if e.get('event')=='start'}
          selected=any(str(x.get('fixture',{}).get('leagueId'))+'|'+str(x.get('fixture',{}).get('matchId'))==key for x in selection.get('matches',[]))
          matches=[]
          if selected:
              observed=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
              incidents=parse_incidents(acta['text'], fixture, observed_at=observed)
              matches=[{'fixture':fixture,'observedAt':observed,'startedNow':key in starts,'test':True,'incidents':incidents}]
          payload={'schema':'zonaok-push-live-incidents-v1','season':'2026/2027','matches':matches}
          Path('push-live-incidents.json').write_text(json.dumps(payload,ensure_ascii=False)+'\n',encoding='utf-8')
          print('Incidències fictícies parsejades:', len(matches[0]['incidents']) if matches else 0)
          PY
      - name: Capturar incidències FECAPA dels partits seleccionats
        if: ${{ inputs.test_scenario == 'production' && inputs.event_source == 'directe' }}
        shell: bash
        run: |
          set -euo pipefail
          selected="$(python -c 'import json; print(len(json.load(open("push-live-selection.json"))["matches"]))')"
          if [ "$selected" -eq 0 ]; then
            printf '%s\n' '{"schema":"zonaok-push-live-incidents-v1","season":"2026/2027","matches":[]}' > push-live-incidents.json
          else
            python -m pip install 'playwright>=1.55,<2'
            python -m playwright install --with-deps chromium
            python scripts/zonaok_push_live_incidents.py capture --input push-live-selection.json --started push-detection.json --output push-live-incidents.json
          fi
      - name: Enviar incidències detectades pel canal habitual
        if: ${{ inputs.test_scenario == 'barca_nc' || inputs.test_scenario == 'semireal_barca_voltrega' || (inputs.test_scenario == 'production' && inputs.event_source == 'directe') }}
        shell: bash
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zonaok-push"
          token="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$request_url" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          response="$(curl --silent --show-error --retry 2 --retry-delay 2 -w '\nHTTP_STATUS:%{http_code}' \
            -X POST 'https://zonaok-push.carles-j-fontanillas.workers.dev/sports-incidents' \
            -H 'Content-Type: application/json' -H "Authorization: Bearer ${token}" \
            --data-binary @push-live-incidents.json)"
          printf '%s\n' "$response"
          status="${response##*HTTP_STATUS:}"
          [[ "$status" =~ ^2[0-9][0-9]$ ]]

      - name: Desar diagnòstic d'enviament sense dades de subscriptors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zonaok-push-diagnostic
          if-no-files-found: ignore
          path: push-transport-report.json

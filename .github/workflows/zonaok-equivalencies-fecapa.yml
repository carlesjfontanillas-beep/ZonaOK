name: ZonaOK - Catàleg oficial equips FECAPA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zonaok-equivalencies-fecapa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zonaok-equivalencies-fecapa
  cancel-in-progress: false
jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Proves i lectura de les lligues conegudes
        run: |
          python -m unittest discover -s tests -p test_equivalencies.py -v
          xvfb-run -a python scripts/zonaok_capture_equivalencies.py
      - name: Publicar exclusivament equivalències oficials
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/zonaok_equivalencies.py --standings captura-equivalencies.json
            git add zonaok-equivalencies-equips.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'ZonaOK: incorporar identificadors i sigles oficials FECAPA'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Informe de cobertura
        if: always()
        run: |
          if [ -f diagnostic-equivalencies.json ]; then
            python -c "import json; print(json.dumps(json.load(open('diagnostic-equivalencies.json'))['stats'],indent=2))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zonaok-equivalencies-fecapa-diagnostic
          path: |
            captura-equivalencies.json
            diagnostic-equivalencies.json
          if-no-files-found: warn

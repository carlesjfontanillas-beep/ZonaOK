name: ZonaOK - Prova cerca i botonera comuna
on:
  push:
    branches: [prova/cerca-nav-comuna]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/frontend_jugadors_prova.py -v

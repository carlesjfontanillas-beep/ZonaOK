name: ZonaOK - Reparar duplicats antics de l'Agenda
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zonaok-reparar-agenda-legacy.yml'
permissions:
  contents: write
concurrency:
  group: zonaok-tots-clubs
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Proves
        run: |
          python -m unittest discover -s tests -p 'test_reparar_agenda_legacy.py' -v
          python -m unittest discover -s tests -p 'test_fecapa_unificat.py' -v
      - name: Reparar i publicar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/zonaok_reparar_agenda_legacy.py --apply
            git add zonaok-tots-partits.json zonaok-tots-agenda.json zonaok-tots-resultats-7dies.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'ZonaOK: retirar registres de calendari global mal atribuïts'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Resum i còpia recuperable
        if: always()
        run: |
          if [ -f reparacio-agenda-report.json ]; then
            echo '### Reparació Agenda' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reparacio-agenda-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zonaok-agenda-quarantena
          path: |
            reparacio-agenda-report.json
            reparacio-agenda-quarantena.json
          if-no-files-found: ignore

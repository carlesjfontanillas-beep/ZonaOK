name: ZonaOK — JUGADORS TOTAL AUTO (esborrany)
on:
  push:
    branches:
      - esborrany/jugadors-total-auto
    paths:
      - scripts/zonaok_jugadors_auto.py
      - tests/test_jugadors_auto.py
      - .github/workflows/zonaok-jugadors-auto.yml
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
permissions:
  contents: read
concurrency:
  group: zonaok-jugadors-auto-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright>=1.55,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Proves de fusió i persistència
        run: python -m unittest discover -s tests -p test_jugadors_auto.py -v
      - name: Importar plantilles FECAPA
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            xvfb-run -a python scripts/zonaok_jugadors_auto.py --league 4774 --league 4775 --league 4786 --league 4789 --league 4804 --seed 4789:11173 --max-teams 3 --diagnostic-only
          else
            xvfb-run -a python scripts/zonaok_jugadors_auto.py --inventory zonaok-classificacions.json --inventory zonaok-tots-agenda.json --seed 4789:11173 --diagnostic-only
          fi
      - name: Diagnòstic agregat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jugadors-diagnostic
          path: jugadors-diagnostic.json
          if-no-files-found: warn

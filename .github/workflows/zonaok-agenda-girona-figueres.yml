name: ZonaOK - Corregir data Girona B Figueres
on:
  push:
    branches: [main]
    paths: ['scripts/zonaok_agenda_girona_figueres.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zonaok-girona-figueres-repair
  cancel-in-progress: false
  queue: max
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar data i conservació dels partits
        run: |
          python -m pip install 'playwright>=1.55,<2' 'jsonschema>=4.23,<5'
          python -m unittest discover -s tests -p 'test_agenda_girona_figueres.py' -v
      - name: Actualitzar data sense duplicats
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/zonaok_agenda_girona_figueres.py
            git add -- zonaok-tots-partits.json zonaok-tots-agenda.json zonaok-tots-resultats-7dies.json zonaok-actes.json imports/agenda-girona-figueres-20261128.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'ZonaOK: conservar la data oficial del Girona B - Figueres'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1

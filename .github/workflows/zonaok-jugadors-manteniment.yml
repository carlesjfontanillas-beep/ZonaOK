name: ZonaOK - Jugadors manteniment (planificació segura)
on:
  push:
    branches:
      - esborrany/jugadors-total-auto
    paths:
      - scripts/zonaok_jugadors_incremental.py
      - tests/test_jugadors_incremental.py
      - .github/workflows/zonaok-jugadors-manteniment.yml
  workflow_run:
    workflows:
      - ZonaOK - Actes TOTAL AUTO (Chromium Playwright)
      - ZonaOK - En directe TOTAL AUTO (Chromium Playwright)
    types: [completed]
    branches: [main]
  schedule:
    # Dilluns 04:15 UTC; 05:15 hivern / 06:15 estiu a Catalunya.
    - cron: '15 4 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [incremental, weekly]
        default: incremental
permissions:
  contents: read
concurrency:
  group: zonaok-jugadors-maintenance
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: catalog
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright>=1.55,<2' 'jsonschema>=4.23,<5'
      - run: python -m unittest discover -s tests -p 'test_jugadors*.py' -v
      - name: Selecció segura sense dades personals ni consultes a FECAPA
        env:
          MODE: ${{ github.event_name == 'schedule' && 'weekly' || inputs.mode || 'incremental' }}
        run: python scripts/zonaok_jugadors_incremental.py --catalog catalog --mode "$MODE"
      # Real maintenance requires a verified persistent private directory on an
      # authorised runner, populated with the initial master. Never attach it
      # to a public GitHub workflow artifact or commit.

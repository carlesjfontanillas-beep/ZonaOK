name: ZonaOK - Reactivar operativa sense cancel·lacions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/zonaok-reactivar-operativa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  reactivar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar codi, finals i regressions abans d'habilitar importacions
        run: |
          python -m pip install 'playwright>=1.55,<2' 'jsonschema>=4.23,<5'
          python -m py_compile scripts/zonaok_fecapa_unificat.py scripts/zonaok_push_events.py scripts/zonaok_actes_recovery_only.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Habilitar només fluxos operatius vigents
        shell: bash
        run: |
          set -euo pipefail
          for w in zonaok-auto-agenda.yml zonaok-auto-directe.yml zonaok-auto-actes.yml zonaok-actes-live.yml zonaok-classificacions-auto.yml jugadors-public.yml zonaok-push-events.yml zonaok-equivalencies-fecapa.yml; do
            gh workflow enable "$w" --repo "$GH_REPO"
            echo "Habilitat: $w"
          done
          gh workflow run zonaok-auto-directe.yml --repo "$GH_REPO" --ref main -f scope=fast -f publish=true

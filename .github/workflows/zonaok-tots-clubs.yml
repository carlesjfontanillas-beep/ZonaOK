name: 'ZonaOK · Agenda completa + marcadors'

on:
  push:
    branches: [main]
    paths:
      - 'imports/tots-agenda-import.json'
      - 'imports/tots-directe-import.json'
      - 'scripts/zonaok_merge_tots.py'
      - '.github/workflows/zonaok-tots-clubs.yml'
  workflow_dispatch:
  schedule:
    # Renova cada dia la finestra mòbil de 7 dies (04:17 UTC)
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: zonaok-tots-clubs
  cancel-in-progress: false

jobs:
  consolidar:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar el repositori
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instal·lar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Proves de no regressió
        run: python -m unittest discover -s tests -p 'test_merge_tots.py' -v
      - name: Aplicar les noves captures
        run: python scripts/zonaok_merge_tots.py
      - name: Publicar només els dos JSON nous
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zonaok-tots-agenda.json zonaok-tots-resultats-7dies.json
          if git diff --cached --quiet; then
            echo "Cap canvi per publicar"
          else
            git commit -m "ZonaOK Tots: actualitzar agenda i resultats"
            git push origin HEAD:main
          fi

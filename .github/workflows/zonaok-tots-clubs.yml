name: 'ZonaOK · Agenda completa + marcadors'

on:
  push:
    branches: [main]
    paths:
      - 'imports/tots-agenda-import.json'
      - 'imports/tots-directe-import.json'
      - 'scripts/zonaok_merge_tots.py'
      - '.github/workflows/zonaok-tots-clubs.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: zonaok-tots-clubs
  cancel-in-progress: false

jobs:
  consolidar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recuperar el repositori
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Instal·lar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provar, fusionar i publicar sense perdre altres commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 -m unittest discover -s tests -p 'test_merge_tots.py' -v
            python3 scripts/zonaok_merge_tots.py
            git add -- zonaok-tots-agenda.json zonaok-tots-resultats-7dies.json
            if git diff --cached --quiet; then
              echo 'Agenda i resultats ja actualitzats: cap canvi.'
              exit 0
            fi
            git commit -m 'ZonaOK Tots: actualitzar agenda i resultats'
            if git push origin HEAD:main; then
              echo 'Publicats els dos JSON de tots els clubs.'
              exit 0
            fi
            echo "Main ha canviat. Repeteixo la fusió ($attempt/5)."
            sleep 2
          done
          echo 'Error: conflictes repetits a main' >&2
          exit 1

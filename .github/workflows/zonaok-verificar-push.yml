name: ZonaOK - Verificar detector push
on:
  push:
    branches: [main]
    paths:
      - scripts/zonaok_push_events.py
      - tests/test_push_events.py
      - .github/workflows/zonaok-verificar-push.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_push_events.py' -v

name: ZonaOK — JUGADORS MASTER TOTAL (esborrany)
on:
  push:
    branches:
      - esborrany/jugadors-total-auto
    paths:
      - scripts/zonaok_jugadors_total_master.py
      - .github/workflows/zonaok-jugadors-total-master.yml
permissions:
  contents: read
concurrency:
  group: zonaok-jugadors-master-total
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Catàlegs actuals de producció
        uses: actions/checkout@v4
        with:
          ref: main
          path: catalog
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright>=1.55,<2' 'jsonschema>=4.23,<5'
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_jugadors*.py' -v
      - name: Importar inventari complet i validar JSON temporal
        run: xvfb-run -a python scripts/zonaok_jugadors_total_master.py --catalog catalog --budget-minutes 330
      - name: Diagnòstic agregat (mai el master)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jugadors-total-master-diagnostic
          path: jugadors-total-master-diagnostic.json
          if-no-files-found: warn

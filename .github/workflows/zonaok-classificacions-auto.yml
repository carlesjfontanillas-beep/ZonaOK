name: ZonaOK - Classificacions AUTO (prova segura)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'fast = actualitzar lligues existents i rotar altres; full = totes per lots'
        required: true
        type: choice
        options:
          - fast
          - full
        default: fast
      limit:
        description: 'Nombre maxim de lligues (0 = totes, evitar en prova)'
        required: true
        type: string
        default: '20'
      offset:
        description: 'Mode full: saltar les primeres N lligues (0, 25, 50...)'
        required: true
        type: string
        default: '0'
      publish:
        description: 'Publicar al JSON? DESACTIVAT per defecte; primer verificar el diagnostic'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '*/5 * * * *'
    - cron: '2 6,7,18,19 * * *'

permissions:
  contents: write

concurrency:
  group: zonaok-tots-clubs
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repositori actual
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decidir si toca importar segons l'horari Europe/Madrid
        id: schedule_gate
        if: ${{ github.event_name == 'schedule' }}
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/zonaok_schedule_gate.py --mode classificacions

      - name: Instal·lar navegador Chromium
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium

      - name: Proves de regressio de classificacions i partits
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Navegar per FECAPA i capturar les classificacions (V2 rapida/completa)
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        env:
          LIMIT: ${{ github.event_name == 'schedule' && '20' || inputs.limit }}
          SCOPE: ${{ github.event_name == 'schedule' && 'fast' || inputs.scope }}
          OFFSET: ${{ github.event_name == 'schedule' && '0' || inputs.offset }}
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python scripts/zonaok_classificacions_auto.py collect \
            --scope "$SCOPE" --offset "$OFFSET" --limit "$LIMIT" \
            --existing zonaok-classificacions.json \
            --capture captura-classificacions.json \
            --report diagnostic-classificacions.json
          python -m json.tool diagnostic-classificacions.json

      - name: Informar dels grups i errors trobats
        if: always()
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          file = Path('diagnostic-classificacions.json')
          if not file.exists():
              print('::warning::No s’ha generat el diagnòstic de FECAPA')
          else:
              data = json.loads(file.read_text(encoding='utf-8'))
              stats = data.get('stats', {})
              summary = [
                  '## ZonaOK — Diagnòstic Classificacions V2',
                  f"- Descobertes: {stats.get('discoveredLeagues', 0)} lligues",
                  f"- Comprovades: {stats.get('checkedLeagues', 0)} lligues",
                  f"- Llegides: {stats.get('validLeagues', 0)} lligues, {stats.get('groups', 0)} grups, {stats.get('teams', 0)} equips",
                  f"- Amb error: {stats.get('failedLeagues', 0)} lligues",
              ]
              for e in data.get('failed', []):
                  msg=f"Lliga {e.get('leagueId')}: {e.get('error', '')}"
                  print('::warning::'+msg[:500])
                  summary.append('- Error: '+msg[:200])
              for msg in data.get('warnings', []):
                  print('::warning::'+str(msg)[:500])
                  summary.append('- Avís: '+str(msg)[:200])
              path=os.environ.get('GITHUB_STEP_SUMMARY')
              if path:
                  with open(path,'a',encoding='utf-8') as f:
                      f.write('\n'.join(summary)+'\n')
          PYCODE

      - name: Arxivar captura i diagnòstic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zonaok-classificacions-diagnostic
          path: |
            captura-classificacions.json
            diagnostic-classificacions.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fusionar i publicar (només amb publish=true)
        if: ${{ ((github.event_name == 'schedule') || (inputs.publish == true)) && (github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/zonaok_classificacions_auto.py merge \
              --capture captura-classificacions.json \
              --existing zonaok-classificacions.json \
              --output zonaok-classificacions.json \
              --report diagnostic-fusio.json
            git add -- zonaok-classificacions.json
            if git diff --cached --quiet; then
              echo 'Sense canvis de classificacio.'
              exit 0
            fi
            git commit -m 'ZonaOK: actualitzar classificacions des de Chromium'
            if git push origin HEAD:main; then
              echo 'Classificacions publicades a main.'
              exit 0
            fi
            echo "Conflicte de publicacio, reintent $attempt"
            sleep 3
          done
          echo 'ERROR: cinc reintents de publicacio fallits.' >&2
          exit 1

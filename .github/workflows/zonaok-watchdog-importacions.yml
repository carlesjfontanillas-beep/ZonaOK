name: ZonaOK - Supervisor de recuperacio i reintents
on:
  push:
    branches: [main]
    paths: ['.github/workflows/zonaok-watchdog-importacions.yml']
  workflow_dispatch:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_run:
    workflows:
      - ZonaOK - Recuperacio de dades de temporada
      - ZonaOK - Agenda TOTAL AUTO (Chromium Playwright)
      - ZonaOK - En directe TOTAL AUTO (Chromium Playwright)
      - ZonaOK - Actes TOTAL AUTO (Chromium Playwright)
      - ZonaOK - Actes i jugadors EN DIRECTE
      - ZonaOK - Classificacions AUTO (prova segura)
      - Importació automàtica de jugadors
      - ZonaOK - Catàleg oficial equips FECAPA
      - ZonaOK - avisos FECAPA
      - ZonaOK - Preparar avisos de les 10 h
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: zonaok-watchdog-importacions
  cancel-in-progress: false
jobs:
  supervisor:
    if: ${{ github.event_name != 'workflow_run' || contains(fromJSON('["failure","cancelled","timed_out","startup_failure","action_required","stale"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validar política de reintents
        run: python -m unittest discover -s tests -p 'test_watchdog.py' -v
      - name: Supervisar i reactivar errors
        run: |
          if [ "$EVENT_NAME" = workflow_run ]; then sleep 120; fi
          python scripts/zonaok_watchdog.py

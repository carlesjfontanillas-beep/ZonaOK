name: 'ZonaOK - Verificar navegacio real'
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'jugadors.html'
      - 'favorits.html'
      - 'notificacions.html'
      - 'zonaok-disseny.css'
      - 'zonaok-disseny.js'
      - 'tests/test_navigation_browser.py'
      - '.github/workflows/zonaok-verificar-navegacio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright>=1.55,<2'
      - run: python -m playwright install --with-deps chromium
      - run: python tests/test_navigation_browser.py

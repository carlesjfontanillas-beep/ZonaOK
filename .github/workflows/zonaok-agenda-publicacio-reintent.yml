name: ZonaOK - Verificar i repetir publicació Agenda
on:
  push:
    branches: [main]
    paths: ['.github/workflows/zonaok-agenda-publicacio-reintent.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprovar que la publicació diària utilitza el motor correcte
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/zonaok-auto-agenda.yml').read_text()
          block=text.split('      - name: Publicar només')[1].split('      - name: Resum')[0]
          assert "if python -c" in block
          assert "python scripts/zonaok_agenda_daily.py merge" in block.split("# Primer validar")[0]
          PY
      - name: Nova lectura i publicació real (clubs amb nom igual a la pista)
        run: gh workflow run zonaok-auto-agenda.yml --ref main -f scope=daily -f publish=true

name: 'ZonaOK - Diagnosticar IDP calendaris (sense publicar dades)'

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zonaok-diagnosticar-idp.yml'

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instal·lar Playwright
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Diagnosticar clics sobre calendaris FECAPA
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python scripts/zonaok_diagnosticar_idp.py
      - name: Desa informe, sense tocar els JSON de producció
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zonaok-diagnostic-idp-calendaris
          if-no-files-found: ignore
          path: diagnostic-calendar-click-idp.json

name: 'ZonaOK - En directe TOTAL AUTO (Chromium Playwright)'

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'fast=actualitzacio dels darrers 7 dies; full=repàs historic'
        required: true
        type: choice
        options:
          - fast
          - full
        default: fast
      limit:
        description: 'Nombre de partits a revisar (nomes Actes); 0=tots'
        required: true
        type: string
        default: '1'
      offset:
        description: 'Mode full Actes: auto o numero de partida'
        required: true
        type: string
        default: 'auto'
      publish:
        description: 'Publicar les dades verificades un cop validades.'
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
    - cron: '2 6,7,18,19 * * *'

permissions:
  contents: write
  actions: write

# Agenda, Directe i Actes comparteixen el JSON; executar-los en serie.
concurrency:
  group: zonaok-tots-clubs
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decidir si toca importar segons l'horari Europe/Madrid
        id: schedule_gate
        if: ${{ github.event_name == 'schedule' }}
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/zonaok_schedule_gate.py --mode directe

      - name: Instal·lar Playwright + Chromium
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright>=1.55,<2' 'jsonschema>=4.23,<5'
          python -m playwright install --with-deps chromium
      - name: Proves de fusió conservadora
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Capturar directe a FECAPA amb navegador real
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        env:
          LIMIT: ${{ github.event_name == 'schedule' && '1' || inputs.limit }}
          SCOPE: ${{ github.event_name == 'schedule' && 'fast' || inputs.scope }}
          OFFSET: ${{ github.event_name == 'schedule' && 'auto' || inputs.offset }}
        run: |
          set -euo pipefail
          xvfb-run -a python scripts/zonaok_fecapa_unificat.py collect \
            --mode directe --scope "${SCOPE:-fast}" --offset "${OFFSET:-auto}" --limit "${LIMIT:-1}" \
            --capture captura-directe-auto.json --report diagnostic-directe-auto.json
      - name: Fusionar JSON únic i generar fitxers compatibles
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/zonaok_fecapa_unificat.py merge \
            --mode directe --capture captura-directe-auto.json \
            --output zonaok-tots-partits.json --compat --report fusio-directe-auto.json
      - name: Publicar només si l'usuari ho activa
        if: ${{ (inputs.publish == true || github.event_name == 'schedule') && (github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Captura ja feta, pero es refa la fusio amb el main mes recent.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/zonaok_fecapa_unificat.py merge \
              --mode directe --capture captura-directe-auto.json \
              --output zonaok-tots-partits.json --compat --report fusio-directe-auto.json
            # Fusionar només duplicats inequívocs abans de la validació i publicació.
            python scripts/zonaok_deduplicar_partits.py --apply --report diagnostic-duplicats-directe.json
            python scripts/zonaok_fecapa_unificat.py validate --output zonaok-tots-partits.json
            git add zonaok-tots-partits.json zonaok-tots-agenda.json zonaok-tots-resultats-7dies.json
            if [ -f zonaok-actes.json ]; then git add zonaok-actes.json; fi
            if git diff --cached --quiet; then echo 'Sense canvis nous'; exit 0; fi
            git commit -m 'ZonaOK AUTO: directe actualitzar JSON unificat'
            if git push origin HEAD:main; then
              python scripts/zonaok_jugadors_trigger.py --catalog zonaok-tots-partits.json --state imports/jugadors-maintenance-state.json --previous-ref HEAD^ > player-trigger.txt
              if grep -q '^run=true$' player-trigger.txt; then
                gh workflow run jugadors-public.yml --repo carlesjfontanillas-beep/ZonaOK --ref main -f mode=flash
              fi
              exit 0
            fi
            echo 'Canvi concurrent a main, es reintenta la fusio...'
            sleep 2
          done
          echo "ERROR: no s'ha pogut publicar després de 4 intents" >&2
          exit 1
      - name: Resum de captura i fusio
        if: always()
        shell: bash
        run: |
          for f in diagnostic-directe-auto.json fusio-directe-auto.json; do
            if [ -f "$f" ]; then
              echo "## $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              head -c 8000 "$f" >> "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Desar diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zonaok-directe-diagnostic
          if-no-files-found: ignore
          path: |
            diagnostic-directe-auto.json
            captura-directe-auto.json
            fusio-directe-auto.json
            diagnostic-duplicats-directe.json

name: 'ZonaOK - En directe TOTAL AUTO (Chromium Playwright)'

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zonaok-auto-directe.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'fast=partits del moment; full es limita també al dia'
        required: true
        type: choice
        options:
          - fast
          - full
        default: fast
      limit:
        description: 'Nombre de partits a revisar (nomes Actes); 0=tots'
        required: true
        type: string
        default: '1'
      offset:
        description: 'Mode full Actes: auto o numero de partida'
        required: true
        type: string
        default: 'auto'
      publish:
        description: 'Publicar les dades verificades un cop validades.'
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'

permissions:
  contents: write
  actions: write

# Una cua per importació; publicació optimista amb fusió sobre el main actual.
concurrency:
  group: zonaok-import-directe
  cancel-in-progress: false
  queue: max

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Marcar inici del cicle
        run: echo "DIRECTE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Decidir si toca importar segons l'horari Europe/Madrid
        id: schedule_gate
        if: ${{ github.event_name == 'schedule' }}
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/zonaok_schedule_gate.py --mode directe

      - name: Instal·lar Playwright + Chromium
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright>=1.55,<2' 'jsonschema>=4.23,<5'
          python -m playwright install --with-deps chromium
      - name: Proves de fusió conservadora
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_schedule_gate_window.py' -v
          python -m unittest discover -s tests -p 'test_fecapa_unificat.py' -v
      - name: Capturar directe a FECAPA amb navegador real
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        env:
          LIMIT: ${{ github.event_name == 'schedule' && '1' || inputs.limit }}
          SCOPE: ${{ github.event_name == 'schedule' && 'fast' || inputs.scope }}
          OFFSET: ${{ github.event_name == 'schedule' && 'auto' || inputs.offset }}
        run: |
          set -euo pipefail
          xvfb-run -a python scripts/zonaok_fecapa_unificat.py collect \
            --mode directe --scope "${SCOPE:-fast}" --offset "${OFFSET:-auto}" --limit "${LIMIT:-1}" \
            --capture captura-directe-auto.json --report diagnostic-directe-auto.json
      - name: Fusionar JSON únic i generar fitxers compatibles
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/zonaok_fecapa_unificat.py merge \
            --mode directe --capture captura-directe-auto.json \
            --output zonaok-tots-partits.json --compat --report fusio-directe-auto.json
      - name: Publicar només si l'usuari ho activa
        if: ${{ (inputs.publish == true || github.event_name == 'schedule' || github.event_name == 'push') && (github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Captura ja feta, pero es refa la fusio amb el main mes recent.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/zonaok_fecapa_unificat.py merge \
              --mode directe --capture captura-directe-auto.json \
              --output zonaok-tots-partits.json --compat --report fusio-directe-auto.json
            # Primer validar la fusió original, després la reducció justificada per duplicats.
            python scripts/zonaok_fecapa_unificat.py validate --output zonaok-tots-partits.json
            python scripts/zonaok_deduplicar_partits.py --report diagnostic-duplicats-directe.json
            mkdir -p imports
            cp fusio-directe-auto.json imports/directe-incidencies.json
            git add zonaok-tots-partits.json zonaok-tots-agenda.json zonaok-tots-resultats-7dies.json imports/directe-incidencies.json
            if [ -f zonaok-actes.json ]; then git add zonaok-actes.json; fi
            if git diff --cached --quiet; then echo 'Sense canvis nous'; exit 0; fi
            git commit -m 'ZonaOK AUTO: directe actualitzar JSON unificat'
            if git push origin HEAD:main; then
              gh workflow run zonaok-push-events.yml --repo carlesjfontanillas-beep/ZonaOK --ref main -f test_scenario=production -f before_sha="$(git rev-parse HEAD^)" -f after_sha="$(git rev-parse HEAD)" -f event_source=directe || echo "::warning::No s'ha pogut activar Push; revisar aquest commit."
              # Finals nous o corregits, fins i tot si encara falta l'IDP.
              if python - <<'PY'
          import json,sys
          from datetime import datetime,timezone
          sys.path.insert(0,'scripts')
          from zonaok_live_finals import current_final
          doc=json.load(open('zonaok-tots-partits.json'))
          captured=json.load(open('captura-directe-auto.json'))['capturedAt']
          sys.exit(0 if any(current_final(r,datetime.now(timezone.utc)) and r.get('finalDetectedAt')==captured for r in doc['matches']) else 1)
          PY
              then
                # One active run plus at most one waiting refresh; pending work is coalesced.
                if waiting=$(gh run list --workflow zonaok-actes-live.yml --repo "$GITHUB_REPOSITORY" --branch main --limit 30 --json status --jq '[.[] | select(.status != "completed" and .status != "in_progress")] | length') && [ "$waiting" = 0 ]; then
                  gh workflow run zonaok-actes-live.yml --repo carlesjfontanillas-beep/ZonaOK --ref main || echo "::warning::Actes i Jugadors: el cron recupera els pendents."
                else
                  echo "::notice::zonaok-actes-live.yml: ja hi ha una execució pendent o no es pot verificar la cua; es conserva el cron."
                fi
                # One active run plus at most one waiting refresh; pending work is coalesced.
                if waiting=$(gh run list --workflow zonaok-classificacions-auto.yml --repo "$GITHUB_REPOSITORY" --branch main --limit 30 --json status --jq '[.[] | select(.status != "completed" and .status != "in_progress")] | length') && [ "$waiting" = 0 ]; then
                  gh workflow run zonaok-classificacions-auto.yml --repo carlesjfontanillas-beep/ZonaOK --ref main -f scope=live -f publish=true || echo "::warning::Classificacions: el cron recupera els grups pendents."
                else
                  echo "::notice::zonaok-classificacions-auto.yml: ja hi ha una execució pendent o no es pot verificar la cua; es conserva el cron."
                fi
              fi
              exit 0
            fi
            echo 'Canvi concurrent a main, es reintenta la fusio...'
            sleep 2
          done
          echo "ERROR: no s'ha pogut publicar després de 8 intents" >&2
          exit 1
      - name: Resum de captura i fusio
        if: always()
        shell: bash
        run: |
          for f in diagnostic-directe-auto.json fusio-directe-auto.json; do
            if [ -f "$f" ]; then
              echo "## $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              head -c 8000 "$f" >> "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Desar diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zonaok-directe-diagnostic
          if-no-files-found: ignore
          path: |
            diagnostic-directe-auto.json
            captura-directe-auto.json
            fusio-directe-auto.json
            diagnostic-duplicats-directe.json

      - name: Continuïtat En directe si GitHub retarda el cron
        if: ${{ always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish == true) && (github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -d .git || exit 0
          test -n "${DIRECTE_STARTED:-}" || exit 0
          # Never cancel another run. Stop chaining outside the active match window.
          remaining=$((300 - $(date +%s) + DIRECTE_STARTED))
          if [ "$remaining" -gt 0 ]; then sleep "$remaining"; fi
          git fetch origin main
          git show origin/main:zonaok-tots-partits.json > "$RUNNER_TEMP/directe-followup.json"
          if ! python - "$RUNNER_TEMP/directe-followup.json" <<'PY'
          import sys
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'scripts')
          from zonaok_schedule_gate import directe_followup_count
          n=directe_followup_count(Path(sys.argv[1]),datetime.now(timezone.utc))
          print('Partits dins la finestra de seguiment:',n)
          sys.exit(0 if n else 1)
          PY
          then
            echo 'Sense partits dins la finestra activa; es conserva el cron.'
            exit 0
          fi
          active=$(gh run list --workflow zonaok-auto-directe.yml --branch main --limit 30 --json databaseId,status --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length")
          if [ "$active" = 0 ]; then
            gh workflow run zonaok-auto-directe.yml --ref main -f scope=fast -f publish=true
            echo 'Nou cicle En directe sol·licitat.'
          else
            echo 'Ja existeix un cicle actiu o en cua.'
          fi

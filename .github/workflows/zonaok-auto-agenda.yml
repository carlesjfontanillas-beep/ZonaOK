name: 'ZonaOK - Agenda TOTAL AUTO (Chromium Playwright)'

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'fast = partits recents i futurs; full = importacio historica per lots'
        required: true
        type: choice
        options:
          - daily
          - fast
          - full
        default: daily
      limit:
        description: 'Maxim lligues (Agenda) o actes; 0=totes (evitar en primera prova)'
        required: true
        type: string
        default: '20'
      offset:
        description: 'full: auto (cursor desat al JSON) o numero de partida'
        required: true
        type: string
        default: 'auto'
      publish:
        description: 'Publicar les dades verificades un cop validades.'
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'

permissions:
  contents: write
  actions: write

# Una cua per importació; publicació optimista amb fusió sobre el main actual.
concurrency:
  group: zonaok-import-agenda
  cancel-in-progress: false
  queue: max

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decidir si toca importar segons l'horari Europe/Madrid
        id: schedule_gate
        if: ${{ github.event_name == 'schedule' }}
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/zonaok_schedule_gate.py --mode agenda

      - name: Instal·lar Playwright + Chromium
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright>=1.55,<2' 'jsonschema>=4.23,<5'
          python -m playwright install --with-deps chromium
      - name: Proves de fusió conservadora
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Capturar agenda a FECAPA amb navegador real
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        env:
          LIMIT: ${{ inputs.limit || '20' }}
          SCOPE: ${{ inputs.scope || 'daily' }}
          OFFSET: ${{ inputs.offset || 'auto' }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" = daily ]; then
            xvfb-run -a python scripts/zonaok_agenda_daily.py collect
          else
            xvfb-run -a python scripts/zonaok_fecapa_unificat.py collect \
              --mode agenda --scope "$SCOPE" --offset "$OFFSET" --limit "$LIMIT" \
              --capture captura-agenda-auto.json --report diagnostic-agenda-auto.json
          fi
      - name: Fusionar JSON únic i generar fitxers compatibles
        if: ${{ github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if python -c "import json,sys;sys.exit(0 if json.load(open('captura-agenda-auto.json')).get('kind')=='agenda-daily' else 1)"; then
            python scripts/zonaok_agenda_daily.py merge
          else
            if python -c "import json,sys;sys.exit(0 if json.load(open('captura-agenda-auto.json')).get('kind')=='agenda-daily' else 1)"; then
              python scripts/zonaok_agenda_daily.py merge
            else
              python scripts/zonaok_fecapa_unificat.py merge \
                --mode agenda --capture captura-agenda-auto.json \
                --output zonaok-tots-partits.json --compat --report fusio-agenda-auto.json
            fi
          fi
      - name: Publicar només si l'usuari ho activa
        if: ${{ (inputs.publish == true || github.event_name == 'schedule') && (github.event_name != 'schedule' || steps.schedule_gate.outputs.run == 'true') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Captura ja feta, pero es refa la fusio amb el main mes recent.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            if python -c "import json,sys;sys.exit(0 if json.load(open('captura-agenda-auto.json')).get('kind')=='agenda-daily' else 1)"; then
              python scripts/zonaok_agenda_daily.py merge
            else
              python scripts/zonaok_fecapa_unificat.py merge \
                --mode agenda --capture captura-agenda-auto.json \
                --output zonaok-tots-partits.json --compat --report fusio-agenda-auto.json
            fi
            # Validate audited duplicate removal for daily; legacy modes remain non-destructive.
            if python -c "import json,sys;sys.exit(0 if json.load(open('captura-agenda-auto.json')).get('kind')=='agenda-daily' else 1)"; then
              python scripts/zonaok_agenda_daily.py validate
              python scripts/zonaok_deduplicar_partits.py --report diagnostic-duplicats-agenda.json
              mkdir -p imports
              cp fusio-agenda-auto.json imports/agenda-daily-report.json
              python scripts/zonaok_push_plan.py --catalog zonaok-tots-partits.json --output imports/push-plan.json
              git add imports/agenda-daily-report.json imports/push-plan.json
            else
              python scripts/zonaok_fecapa_unificat.py validate --output zonaok-tots-partits.json
              python scripts/zonaok_deduplicar_partits.py --apply --report diagnostic-duplicats-agenda.json
            fi
            git add zonaok-tots-partits.json zonaok-tots-agenda.json zonaok-tots-resultats-7dies.json
            if [ -f zonaok-actes.json ]; then git add zonaok-actes.json; fi
            if git diff --cached --quiet; then echo 'Sense canvis nous'; exit 0; fi
            git commit -m 'ZonaOK AUTO: agenda actualitzar JSON unificat'
            if git push origin HEAD:main; then
              gh workflow run zonaok-push-events.yml --repo carlesjfontanillas-beep/ZonaOK --ref main -f test_scenario=production -f before_sha="$(git rev-parse HEAD^)" -f after_sha="$(git rev-parse HEAD)" -f event_source=agenda || echo "::warning::No s'ha pogut activar Push; revisar aquest commit."
              if python -c "import json,sys;sys.exit(0 if json.load(open('fusio-agenda-auto.json')).get('recoveredResultCount',0)>0 else 1)"; then
                gh workflow run zonaok-actes-live.yml --ref main || echo "::warning::Actes i Jugadors recuperaran els finals pendents."
                gh workflow run zonaok-classificacions-auto.yml --ref main -f scope=live -f publish=true || echo "::warning::Classificacions es recuperarà al cron."
                exit 0
              fi
              python scripts/zonaok_jugadors_trigger.py --catalog zonaok-tots-partits.json --state imports/jugadors-maintenance-state.json --previous-ref HEAD^ > player-trigger.txt
              if grep -q '^run=true$' player-trigger.txt; then
                gh workflow run jugadors-public.yml --repo carlesjfontanillas-beep/ZonaOK --ref main -f mode=flash || echo "::warning::No s'ha pogut activar Jugadors; el repàs programat recupera els partits pendents."
              fi
              exit 0
            fi
            echo 'Canvi concurrent a main, es reintenta la fusio...'
            sleep 2
          done
          echo "ERROR: no s'ha pogut publicar després de 8 intents" >&2
          exit 1
      - name: Resum de captura i fusio
        if: always()
        shell: bash
        run: |
          for f in diagnostic-agenda-auto.json fusio-agenda-auto.json; do
            if [ -f "$f" ]; then
              echo "## $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              head -c 8000 "$f" >> "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Desar diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zonaok-agenda-diagnostic
          if-no-files-found: ignore
          path: |
            diagnostic-agenda-auto.json
            captura-agenda-auto.json
            fusio-agenda-auto.json
            diagnostic-duplicats-agenda.json

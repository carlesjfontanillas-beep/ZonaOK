name: ZonaOK - Prova botonera jugadors
on:
  push:
    branches: [prova/botonera-jugadors]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/frontend_jugadors_prova.py -v

name: ZonaOK — actes_total · tots els clubs

on:
  push:
    branches: [main]
    paths:
      - 'imports/actes-tots/*.json'
      - 'scripts/zonaok_merge_actes_tots.py'
      - 'tests/test_actes_tots.py'
      - '.github/workflows/zonaok-actes-total.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zonaok-actes-total
  cancel-in-progress: false

jobs:
  importar-actes-total:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recuperar el repositori
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Comprovar i fusionar enllaços d'acta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 -m unittest discover -s tests -p 'test_actes_tots.py' -v
            python3 scripts/zonaok_merge_actes_tots.py
            git add -- zonaok-tots-agenda.json zonaok-data.json zonaok-tots-resultats-7dies.json zonaok-tots-actes.json
            if git diff --cached --quiet; then
              echo 'Actes TOTAL: no hi ha nous enllaços. Dades intactes.'
              exit 0
            fi
            git commit -m 'ZonaOK: actes_total associar URLs oficials a ambdues agendes'
            if git push origin HEAD:main; then
              echo 'Actes TOTAL: enllaços publicats, marcadors intactes.'
              exit 0
            fi
            echo "main ha canviat, reintent $attempt/5"
            sleep 2
          done
          echo 'ERROR: no s’han pogut publicar els enllaços.' >&2
          exit 1

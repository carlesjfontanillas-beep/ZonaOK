name: 'ZonaOK - Actes TOTAL AUTO (Chromium Playwright)'
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zonaok-auto-actes.yml'
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [full, fast]
        default: full
      limit:
        type: string
        default: '40'
      offset:
        type: string
        default: auto
      publish:
        type: boolean
        default: true
  schedule:
    - cron: '3,18,33,48 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: zonaok-import-actes
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Pausar tots els altres workflows i cancel·lar imports en curs
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/workflows?per_page=100" --jq '.workflows[] | select(.path | startswith(".github/workflows/")) | select(.path != ".github/workflows/zonaok-auto-actes.yml") | select(.state == "active") | [.id,.path] | @tsv' > "$RUNNER_TEMP/workflows-to-pause"
          while IFS=$'\t' read -r id path; do
            [ -n "$id" ] || continue
            gh api -X PUT "repos/$GH_REPO/actions/workflows/$id/disable"
            echo "PAUSAT: $path"
          done < "$RUNNER_TEMP/workflows-to-pause"
          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$GH_REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.path | startswith(".github/workflows/")) | select(.path != ".github/workflows/zonaok-auto-actes.yml") | select(.status != "completed") | .id' > "$RUNNER_TEMP/other-runs"
            if [ ! -s "$RUNNER_TEMP/other-runs" ]; then break; fi
            while read -r id; do
              gh run cancel "$id" --repo "$GH_REPO" || true
            done < "$RUNNER_TEMP/other-runs"
            sleep 10
          done
          gh api "repos/$GH_REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.path | startswith(".github/workflows/")) | select(.path != ".github/workflows/zonaok-auto-actes.yml") | select(.status != "completed") | .id' > "$RUNNER_TEMP/other-runs"
          test ! -s "$RUNNER_TEMP/other-runs"
          echo "Només Actes queda habilitat; altres execucions aturades."
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar i provar els lectors FECAPA
        run: |
          python -m pip install 'playwright>=1.55,<2' 'jsonschema>=4.23,<5'
          python -m playwright install --with-deps chromium
          python -m py_compile scripts/zonaok_actes_recovery_only.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fase 1 - recuperar IDP (només identificadors; agenda i marcadors intactes)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          xvfb-run -a python scripts/zonaok_actes_recovery_only.py ids | tee "$RUNNER_TEMP/actes-ids.log"
          python scripts/zonaok_fecapa_unificat.py validate
          git add -- zonaok-tots-partits.json zonaok-tots-agenda.json zonaok-tots-resultats-7dies.json zonaok-actes.json imports/actes-recovery-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'ZonaOK Actes exclusiu: recuperar IDP oficials'
            git push origin HEAD:main
          fi
      - name: Fase 2 - llegir acta oficial tancada i dades completes
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          mkdir -m 700 data
          trap 'rm -rf data' EXIT
          gzip -dc imports/jugadors-master.json.gz > data/jugadors-master.json
          cp imports/jugadors-maintenance-state.json data/jugadors-maintenance-state.json
          xvfb-run -a python scripts/zonaok_actes_recovery_only.py acts "$PWD/data" | tee "$RUNNER_TEMP/actes-contingut.log"
          python scripts/verify_public_master.py data/jugadors-master.json
          python scripts/zonaok_fecapa_unificat.py validate
          gzip -n -c data/jugadors-master.json > imports/jugadors-master.json.gz
          cp data/jugadors-maintenance-state.json imports/jugadors-maintenance-state.json
          git add -- zonaok-tots-partits.json zonaok-tots-agenda.json zonaok-tots-resultats-7dies.json zonaok-actes.json imports/actes-recovery-state.json imports/jugadors-master.json.gz imports/jugadors-maintenance-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'ZonaOK Actes exclusiu: dades oficials verificades'
            git push origin HEAD:main
          fi
      - name: Resum i diagnòstic per a la revisió
        if: always()
        shell: bash
        run: |
          for f in "$RUNNER_TEMP/actes-ids.log" "$RUNNER_TEMP/actes-contingut.log"; do
            if [ -f "$f" ]; then
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zonaok-actes-recuperacio
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/actes-ids.log
            ${{ runner.temp }}/actes-contingut.log

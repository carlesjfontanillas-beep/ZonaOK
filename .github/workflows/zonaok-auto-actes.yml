name: 'ZonaOK - Actes TOTAL AUTO (Chromium Playwright)'
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zonaok-auto-actes.yml'
      - 'scripts/zonaok_actes_recovery_only.py'
      - 'scripts/zonaok_agenda_dates_review.py'
      - 'scripts/zonaok_fecapa_unificat.py'
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [full, fast, review9, agenda_dates]
        default: full
      limit:
        type: string
        default: '40'
      offset:
        type: string
        default: auto
      retry_depth:
        type: string
        default: '0'
      publish:
        type: boolean
        default: true
  schedule:
    - cron: '3,18,33,48 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: zonaok-import-actes
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Pausar tots els altres workflows i cancel·lar imports en curs
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/workflows?per_page=100" --jq '.workflows[] | select(.path | startswith(".github/workflows/")) | select(.path != ".github/workflows/zonaok-auto-actes.yml") | select(.state == "active") | [.id,.path] | @tsv' > "$RUNNER_TEMP/workflows-to-pause"
          while IFS=$'\t' read -r id path; do
            [ -n "$id" ] || continue
            gh api -X PUT "repos/$GH_REPO/actions/workflows/$id/disable"
            echo "PAUSAT: $path"
          done < "$RUNNER_TEMP/workflows-to-pause"
          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$GH_REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.path | startswith(".github/workflows/")) | select(.path != ".github/workflows/zonaok-auto-actes.yml") | select(.status != "completed") | .id' > "$RUNNER_TEMP/other-runs"
            if [ ! -s "$RUNNER_TEMP/other-runs" ]; then break; fi
            while read -r id; do
              gh run cancel "$id" --repo "$GH_REPO" || true
            done < "$RUNNER_TEMP/other-runs"
            sleep 10
          done
          gh api "repos/$GH_REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.path | startswith(".github/workflows/")) | select(.path != ".github/workflows/zonaok-auto-actes.yml") | select(.status != "completed") | .id' > "$RUNNER_TEMP/other-runs"
          test ! -s "$RUNNER_TEMP/other-runs"
          echo "Només Actes queda habilitat; altres execucions aturades."
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Seleccionar finestra de recuperació sense escriptors simultanis
        shell: bash
        env:
          REQUEST_SCOPE: ${{ inputs.scope || 'full' }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          paths={"early":"imports/actes-recovery-20261101-12.json","recent":"imports/actes-recovery-state.json"}
          # Start the new interval first, then rotate oldest completed lot.
          def last_done(k):
              p=Path(paths[k])
              return json.loads(p.read_text()).get("lastActsFinishedAt","") if p.exists() else ""
          review=Path("imports/actes-recovery-review9.json")
          review_done=review.exists() and bool(json.loads(review.read_text()).get("lastActsFinishedAt"))
          agenda=Path("imports/agenda-revisio-20261101-1231.json")
          agenda_report=json.loads(agenda.read_text()) if agenda.exists() else {}
          agenda_done=bool(agenda_report.get("finishedAt"))
          scoreless_review_pending=bool(agenda_report.get("unresolvedWithoutResultCount",0))
          script_sha=hashlib.sha256(Path("scripts/zonaok_agenda_dates_review.py").read_bytes()).hexdigest()
          agenda_code_current=agenda_report.get("reviewScriptSha")==script_sha
          if os.environ["REQUEST_SCOPE"]=="agenda_dates" or not agenda_done or not agenda_code_current or scoreless_review_pending:
              window="agenda_dates"
              paths[window]=str(agenda)
          elif os.environ["REQUEST_SCOPE"]=="review9" or not review_done:
              window="review9"
              paths[window]=str(review)
          else:
              window="early" if not Path(paths["early"]).exists() else min(paths,key=lambda k:(last_done(k),k))
          with open(os.environ["GITHUB_ENV"],"a") as out:
              print("ZONAOK_ACTES_WINDOW="+window,file=out)
              print("ACTES_STATE="+paths[window],file=out)
          print("Finestra seleccionada:",window,paths[window])
          PY
      - name: Preparar i provar els lectors FECAPA
        run: |
          python -m pip install 'playwright>=1.55,<2' 'jsonschema>=4.23,<5'
          python -m playwright install --with-deps chromium
          python -m py_compile scripts/zonaok_actes_recovery_only.py scripts/zonaok_agenda_dates_review.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Agenda puntual - dates i hores del 1 novembre al 31 desembre
        if: ${{ env.ZONAOK_ACTES_WINDOW == 'agenda_dates' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          result=0
          xvfb-run -a python scripts/zonaok_agenda_dates_review.py || result=$?
          if [ "$result" = 0 ]; then
            python scripts/zonaok_fecapa_unificat.py validate
            git add -- zonaok-tots-partits.json zonaok-tots-agenda.json zonaok-tots-resultats-7dies.json zonaok-actes.json
          else
            git restore -- zonaok-tots-partits.json zonaok-tots-agenda.json zonaok-tots-resultats-7dies.json zonaok-actes.json
          fi
          test -f "$ACTES_STATE"
          git add -- "$ACTES_STATE"
          if ! git diff --cached --quiet; then
            git commit -m 'ZonaOK Agenda puntual: revisió exclusiva de dates i hores novembre-desembre'
            git push origin HEAD:main
          fi
          exit "$result"
      - name: Fase 1 - recuperar IDP (només identificadors; agenda i marcadors intactes)
        if: ${{ env.ZONAOK_ACTES_WINDOW != 'agenda_dates' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          xvfb-run -a python scripts/zonaok_actes_recovery_only.py ids | tee "$RUNNER_TEMP/actes-ids.log"
          python scripts/zonaok_fecapa_unificat.py validate
          python scripts/zonaok_deduplicar_partits.py --report diagnostic-duplicats-actes.json
          git add -- zonaok-tots-partits.json zonaok-tots-agenda.json zonaok-tots-resultats-7dies.json zonaok-actes.json "$ACTES_STATE"
          if ! git diff --cached --quiet; then
            git commit -m 'ZonaOK Actes exclusiu: recuperar IDP oficials'
            git push origin HEAD:main
          fi
      - name: Fase 2 - llegir acta oficial tancada i dades completes
        if: ${{ env.ZONAOK_ACTES_WINDOW != 'agenda_dates' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          mkdir -m 700 data
          trap 'rm -rf data' EXIT
          gzip -dc imports/jugadors-master.json.gz > data/jugadors-master.json
          cp imports/jugadors-maintenance-state.json data/jugadors-maintenance-state.json
          xvfb-run -a python scripts/zonaok_actes_recovery_only.py acts "$PWD/data" | tee "$RUNNER_TEMP/actes-contingut.log"
          python scripts/verify_public_master.py data/jugadors-master.json
          python scripts/zonaok_fecapa_unificat.py validate
          python scripts/zonaok_deduplicar_partits.py --report diagnostic-duplicats-actes.json
          gzip -n -c data/jugadors-master.json > imports/jugadors-master.json.gz
          cp data/jugadors-maintenance-state.json imports/jugadors-maintenance-state.json
          git add -- zonaok-tots-partits.json zonaok-tots-agenda.json zonaok-tots-resultats-7dies.json zonaok-actes.json "$ACTES_STATE" imports/jugadors-master.json.gz imports/jugadors-maintenance-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'ZonaOK Actes exclusiu: dades oficials verificades'
            git push origin HEAD:main
          fi
      - name: Resum i diagnòstic per a la revisió
        if: always()
        shell: bash
        run: |
          for f in "$RUNNER_TEMP/actes-ids.log" "$RUNNER_TEMP/actes-contingut.log" "$ACTES_STATE"; do
            if [ "$f" = "$ACTES_STATE" ] && [ "${ZONAOK_ACTES_WINDOW:-}" != agenda_dates ]; then continue; fi
            if [ -f "$f" ]; then
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zonaok-actes-recuperacio
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/actes-ids.log
            ${{ runner.temp }}/actes-contingut.log
            imports/agenda-revisio-20261101-1231.json

      - name: Encadenar el següent lot de la finestra o reintentar amb pausa
        if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        env:
          RETRY_DEPTH: ${{ inputs.retry_depth || '0' }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${ZONAOK_ACTES_WINDOW:-}" = agenda_dates ] && [ -f "$ACTES_STATE" ]; then
            if [ "$JOB_STATUS" != success ]; then
              echo "::error::Agenda no ha acabat correctament; no s'encadena Actes."
              exit 1
            fi
            python - <<'PY'
          import hashlib,json
          from pathlib import Path
          report=json.loads(Path("imports/agenda-revisio-20261101-1231.json").read_text())
          expected=hashlib.sha256(Path("scripts/zonaok_agenda_dates_review.py").read_bytes()).hexdigest()
          if not report.get("finishedAt") or report.get("reviewScriptSha") != expected:
              raise SystemExit("L'informe Agenda no és complet o no correspon al codi revisat.")
          PY
            unresolved_no_result=$(python -c 'import json; print(json.load(open("imports/agenda-revisio-20261101-1231.json")).get("unresolvedWithoutResultCount", 0))')
            if [ "$unresolved_no_result" -gt 0 ]; then
              echo "::notice::Queden $unresolved_no_result partits sense resultat pendents de verificar amb Agenda; Actes no s'encadena."
              exit 0
            fi
            echo "Agenda puntual publicada i validada; Actes i la resta d'accions continuen pausats per instrucció de l'usuari."
            exit 0
          fi
          if [ "${ZONAOK_ACTES_WINDOW:-}" = review9 ]; then
            echo "Lot exclusiu acabat; recuperar la cua històrica amb el mode full."
          fi
          if [ "$JOB_STATUS" != success ]; then
            [[ "$RETRY_DEPTH" =~ ^[0-9]+$ ]] || exit 1
            if [ "$RETRY_DEPTH" -lt 2 ]; then
              echo "Error: reintent limitat després de 120 segons"
              sleep 120
              depth=$((RETRY_DEPTH+1))
            else
              echo "::warning::Dos reintents esgotats; esperar cron o diagnòstic"
              exit 0
            fi
          else
            if [ ! -f "$RUNNER_TEMP/actes-contingut.log" ]; then exit 0; fi
            if ! python - <<'PY'
          import json,os,sys
          from pathlib import Path
          paths=[Path("imports/actes-recovery-state.json"),Path("imports/actes-recovery-20261101-12.json")]
          current=json.loads(Path(os.environ["ACTES_STATE"]).read_text())
          blocked=bool(current.get("lastActs",{}).get("blocked") or current.get("lastIds",{}).get("blocked"))
          def ready(p):
              if not p.exists():return True
              s=json.loads(p.read_text());a=s.get("lastActs",{});i=s.get("lastIds",{})
              if not a:return True
              missing=a.get("after",{}).get("missingHistoricalIDs",0)
              return bool(a.get("readyNext",0) or (missing and (i.get("untriedLeagues",0) or i.get("calendarIDs",0) or i.get("legacyIDs",0))))
          work=[p.name for p in paths if ready(p)]
          print("Finestres amb feina immediata:",work,"bloqueig:",blocked)
          sys.exit(0 if work and not blocked else 1)
          PY
            then
              echo "Sense treball immediat recuperable; el cron manté els reintents espaiats."
              exit 0
            fi
            depth=0
            sleep 15
          fi
          active=$(gh run list --workflow zonaok-auto-actes.yml --branch main --limit 30 --json databaseId,status --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length")
          if [ "$active" = 0 ]; then
            gh workflow run zonaok-auto-actes.yml --ref main -f scope=full -f publish=true -f retry_depth="$depth"
            echo "Lot següent sol·licitat."
          else
            echo "Ja hi ha un lot en cua."
          fi

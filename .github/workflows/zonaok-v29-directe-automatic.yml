name: ZonaOK V29 - En directe (nomes marcadors, Agenda intacta)
on:
  push:
    branches: [main]
    paths:
      - 'imports/directe/v29/*.json'
      - 'scripts/zonaok_import_directe_v29.py'
      - 'scripts/zonaok_import_directe_v29_compat.py'
      - 'tests/test_v29_aliases.py'
      - '.github/workflows/zonaok-v29-directe-automatic.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zonaok-v29-directe
  cancel-in-progress: false
jobs:
  actualitzar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recuperar el repositori
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Comprovar correspondencies i publicar nomes marcadors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 -m unittest discover -s tests -p 'test_v29_aliases.py' -v
            # IMPORTANT: cal executar el conciliador amb les regles BAR/CPSC
            # (no l'script V29.5 original amb rival obligatori).
            python3 scripts/zonaok_import_directe_v29_compat.py
            git add -- zonaok-data.json
            if git diff --cached --quiet; then
              echo 'Sense marcadors nous. Agenda i altres dades intactes.'
              exit 0
            fi
            git commit -m 'ZonaOK V29.9: associar resultats per club, data i hora'
            if git push origin HEAD:main; then
              echo 'Marcadors publicats: Agenda, actes i classificacions intactes.'
              exit 0
            fi
            echo "main ha canviat; reintento $attempt/5"
            sleep 2
          done
          echo 'ERROR: no es poden publicar els marcadors.' >&2
          exit 1

name: ZonaOK - Completar correccions confirmades Agenda
on:
  push:
    branches: [main]
    paths: ['imports/agenda-reparacio-restants-20261128-confirmats.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: zonaok-confirmed-schedule-repairs
  cancel-in-progress: false
  queue: max
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Proves de fusió i conservació
        run: |
          python -m pip install 'playwright>=1.55,<2' 'jsonschema>=4.23,<5'
          python -m unittest discover -s tests -p 'test_agenda_reparacio*.py' -v
      - name: Aplicar els sis casos confirmats i guardar auditoria
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/zonaok_agenda_reparacio_restants.py
            git add -- zonaok-tots-partits.json zonaok-tots-agenda.json zonaok-tots-resultats-7dies.json zonaok-actes.json imports/agenda-reparacio-restants-20261128-resultat.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'ZonaOK: conservar dates més tardanes i corregir veterans'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Activar una Agenda real amb publicació
        run: gh workflow run zonaok-auto-agenda.yml --ref main -f scope=daily -f publish=true
